<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>แบบทดสอบระบบเครือข่าย 10 ข้อ</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;background:#eef2f7;color:#172033}
.container{max-width:850px;margin:0 auto;padding:20px}.card{background:white;border-radius:18px;padding:26px;box-shadow:0 8px 30px #00000012}
h1{margin-top:0}.muted{color:#64748b}.row{display:grid;grid-template-columns:1fr 1fr;gap:14px}
label{font-weight:700;display:block;margin-bottom:6px}input{width:100%;padding:13px;border:1px solid #cbd5e1;border-radius:10px;font-size:16px}
button{border:0;border-radius:10px;padding:12px 18px;font-size:16px;font-weight:700;cursor:pointer;background:#2563eb;color:white}
button.secondary{background:#e2e8f0;color:#172033}button.danger{background:#dc2626}.actions{display:flex;justify-content:space-between;gap:10px;margin-top:22px}
.top{display:flex;justify-content:space-between;align-items:center;gap:15px;margin-bottom:16px}.timer{font-size:20px;font-weight:800;padding:10px 14px;border-radius:10px;background:#fee2e2;color:#b91c1c}
.progress{height:9px;background:#e2e8f0;border-radius:99px;overflow:hidden;margin:10px 0 22px}.bar{height:100%;background:#2563eb;width:0}
.option{display:block;border:1px solid #cbd5e1;border-radius:12px;padding:14px;margin:10px 0;cursor:pointer}.option:hover{background:#f8fafc}.option input{width:auto;margin-right:10px}
.hidden{display:none}.score{font-size:42px;font-weight:900;text-align:center}.result-item{padding:13px;border-radius:10px;margin:9px 0;background:#f8fafc}.correct{border-left:5px solid #16a34a}.wrong{border-left:5px solid #dc2626}
.small{font-size:14px}table{width:100%;border-collapse:collapse;margin-top:15px}th,td{border:1px solid #cbd5e1;padding:8px;text-align:left;font-size:14px}th{background:#f1f5f9}
@media(max-width:600px){.row{grid-template-columns:1fr}.container{padding:10px}.card{padding:18px}}
</style>
</head>
<body>
<div class="container">
<div id="start" class="card">
<h1>แบบทดสอบระบบเครือข่าย</h1>
<p class="muted">จำนวน 10 ข้อ • เวลาทำ 60 นาที • เลือกคำตอบที่ถูกที่สุด</p>
<div class="row">
<div><label>ชื่อ-นามสกุล</label><input id="studentName" placeholder="กรอกชื่อ-นามสกุล"></div>
<div><label>รหัสนักศึกษา</label><input id="studentId" placeholder="กรอกรหัสนักศึกษา"></div>
</div>
<br><button onclick="startExam()">เริ่มทำข้อสอบ</button>
<div style="margin-top: 20px; text-align: right;">
<button class="secondary" onclick="showTeacherPanel()">สำหรับผู้สอน (ดูคะแนนที่บันทึก)</button>
</div>
</div>

<div id="exam" class="card hidden">
<div class="top"><div><b id="qnum"></b><div class="small muted" id="studentInfo"></div></div><div class="timer" id="timer">60:00</div></div>
<div class="progress"><div class="bar" id="bar"></div></div>
<div id="question"></div>
<div class="actions"><button class="secondary" id="prev" onclick="prevQ()">ย้อนกลับ</button><button id="next" onclick="nextQ()">ถัดไป</button></div>
</div>

<div id="result" class="card hidden">
<h1>ผลการสอบ</h1>
<div id="resultInfo"></div><div class="score" id="score"></div><div id="answers"></div>
<div class="actions"><button onclick="location.reload()">เริ่มใหม่</button><button onclick="window.print()">พิมพ์ผลสอบ</button></div>
</div>

<div id="teacherPanel" class="card hidden">
<h1>ระบบจัดการคะแนน (สำหรับผู้สอน)</h1>
<p class="muted">รายชื่อนักศึกษาที่ทำแบบทดสอบและบันทึกไว้ในเครื่องนี้</p>
<div id="recordList"></div>
<div class="actions"><button class="secondary" onclick="clearRecords()" class="danger" style="background:#dc2626;color:white;">ล้างข้อมูลทั้งหมด</button><button onclick="backToHome()">กลับหน้าแรก</button></div>
</div>
</div>

<script>
const questions=[
["เลเยอร์ใดใน OSI Model ที่ทำหน้าที่ในการเลือกเส้นทาง (Routing) เพื่อส่งข้อมูลไปยังปลายทางที่อยู่คนละเครือข่าย?",["Data Link Layer","Network Layer","Transport Layer","Application Layer"],1],
["อุปกรณ์ใดทำงานโดยการส่งข้อมูลออกไปยังทุกพอร์ต (Broadcast) ยกเว้นพอร์ตที่ข้อมูลนั้นเข้ามา ทำให้เกิดโอกาสเกิด Collision ได้สูง?",["Switch","Router","Hub","Access Point"],2],
["โปรโตคอล TCP แตกต่างจาก UDP อย่างไรในด้านการส่งข้อมูล?",["TCP ส่งข้อมูลได้รวดเร็วกว่า UDP","TCP มีการตรวจสอบความถูกต้องและรับประกันการส่งข้อมูล","UDP มีการจองเส้นทางและจัดทำ 3-Way Handshake ก่อนส่งข้อมูล","UDP ใช้สำหรับการส่งข้อมูลที่ต้องการความถูกต้องสูงเสมอ"],1],
["IP Address รุ่นใดที่มีขนาด 128 บิต และถูกพัฒนาขึ้นมาเพื่อแก้ปัญหาการขาดแคลนหมายเลขที่อยู่?",["IPv4","IPv6","MAC Address","Subnet Mask"],1],
["เมื่อเราพิมพ์ชื่อเว็บไซต์ เช่น www.google.com เครือข่ายจะใช้บริการใดในการแปลงชื่อนั้นให้เป็น IP Address?",["DHCP","DNS","FTP","HTTP"],1],
["พอร์ตมาตรฐาน (Default Port) ของโปรโตคอล HTTPS คือพอร์ตหมายเลขใด?",["80","21","443","8080"],2],
["ข้อใดคือความหมายของ 'Default Gateway' ในการตั้งค่าเครือข่าย?",["ความเร็วสูงสุดที่เครือข่ายสามารถส่งข้อมูลได้","ทางออกหรือจุดเชื่อมต่อไปยังเครือข่ายภายนอก (เช่น อินเทอร์เน็ต)","หมายเลขประจำตัวของเครื่องคอมพิวเตอร์ในวงแลน","ชื่อโดเมนของเซิร์ฟเวอร์หลัก"],1],
["Topology แบบใดที่หากสายสัญญาณหลักขาดเพียงจุดเดียว จะทำให้เครือข่ายทั้งหมดไม่สามารถสื่อสารกันได้?",["Star Topology","Bus Topology","Mesh Topology","Tree Topology"],1],
["MAC Address เป็นหมายเลขที่ทำงานอยู่ในเลเยอร์ใดของ OSI Model?",["Physical Layer","Data Link Layer","Network Layer","Session Layer"],1],
["IP Address ในข้อใดที่จัดอยู่ในกลุ่ม Private IP Address (Class C) ที่มักใช้ในเครือข่ายตามบ้าน?",["10.0.0.1","172.16.0.1","192.168.1.1","8.8.8.8"],2]
];
let cur=0, ans=Array(10).fill(null), seconds=3600, timerId=null, name="",sid="";

function startExam(){
 name=document.getElementById("studentName").value.trim();sid=document.getElementById("studentId").value.trim();
 if(!name||!sid){alert("กรุณากรอกชื่อ-นามสกุลและรหัสนักศึกษา");return}
 document.getElementById("start").classList.add("hidden");document.getElementById("exam").classList.remove("hidden");
 document.getElementById("studentInfo").textContent=name+" • "+sid;render();timerId=setInterval(tick,1000);
}
function tick(){seconds--;if(seconds<=0){seconds=0;renderTimer();clearInterval(timerId);finish();}else renderTimer()}
function renderTimer(){let m=Math.floor(seconds/60),s=seconds%60;document.getElementById("timer").textContent=String(m).padStart(2,"0")+":"+String(s).padStart(2,"0")}
function render(){
 document.getElementById("qnum").textContent="ข้อ "+(cur+1)+" / 10";document.getElementById("bar").style.width=((cur+1)/10*100)+"%";
 let q=questions[cur];let letters=["ก","ข","ค","ง"];
 document.getElementById("question").innerHTML="<h2>"+q[0]+"</h2>"+q[1].map((x,i)=>`<label class="option"><input type="radio" name="answer" value="${i}" ${ans[cur]===i?"checked":""} onchange="ans[cur]=Number(this.value)"> ${letters[i]}. ${x}</label>`).join("");
 document.getElementById("prev").disabled=cur===0;document.getElementById("next").textContent=cur===9?"ส่งคำตอบ":"ถัดไป";renderTimer();
}
function prevQ(){save();if(cur>0){cur--;render()}}
function nextQ(){save();if(cur<9){cur++;render()}else finish()}
function save(){let r=document.querySelector('input[name="answer"]:checked');if(r)ans[cur]=Number(r.value)}

function finish(){
 clearInterval(timerId);
 document.getElementById("exam").classList.add("hidden");
 document.getElementById("result").classList.remove("hidden");
 let score=ans.reduce((n,a,i)=>n+(a===questions[i][2]?1:0),0);
 document.getElementById("score").textContent=score+" / 10 คะแนน";
 document.getElementById("resultInfo").innerHTML="<p><b>ชื่อ:</b> "+esc(name)+" &nbsp; <b>รหัส:</b> "+esc(sid)+"</p>";
 let letters=["ก","ข","ค","ง"];
 document.getElementById("answers").innerHTML=questions.map((q,i)=>{let ok=ans[i]===q[2];return `<div class="result-item ${ok?"correct":"wrong"}"><b>ข้อ ${i+1}: ${ok?"ถูก":"ผิด/ไม่ตอบ"}</b><br>คำตอบของคุณ: ${ans[i]===null?"ไม่ตอบ":letters[ans[i]]+". "+q[1][ans[i]]}<br><b>เฉลย: ${letters[q[2]]}. ${q[1][q[2]]}</b></div>`}).join("");

 // บันทึกข้อมูลลงใน LocalStorage ของเบราว์เซอร์
 saveRecord(name, sid, score);
}

function saveRecord(studentName, studentId, score){
 let records = JSON.parse(localStorage.getItem("exam_records") || "[]");
 // ตรวจสอบว่ามีรหัสนี้เคยสอบไปแล้วหรือยัง (อัปเดตถ้ามี หรือเพิ่มใหม่)
 let existingIndex = records.findIndex(r => r.sid === studentId);
 let recordData = { name: studentName, sid: studentId, score: score, time: new Date().toLocaleString() };
 if(existingIndex >= -1){
     records.push(recordData); // บันทึกเพิ่มใหม่ทุกครั้งที่ทำเสร็จ
 }
 localStorage.setItem("exam_records", JSON.stringify(records));
}

function showTeacherPanel(){
 document.getElementById("start").classList.add("hidden");
 document.getElementById("teacherPanel").classList.remove("hidden");
 let records = JSON.parse(localStorage.getItem("exam_records") || "[]");
 let html = "";
 if(records.length === 0){
     html = "<p>ยังไม่มีประวัติการทำแบบทดสอบในเครื่องนี้</p>";
 } else {
     html = `<table><tr><th>ลำดับ</th><th>รหัสนักศึกษา</th><th>ชื่อ-นามสกุล</th><th>คะแนน</th><th>เวลาที่ส่ง</th></tr>`;
     records.forEach((r, index) => {
         html += `<tr><td>${index+1}</td><td>${esc(r.sid)}</td><td>${esc(r.name)}</td><td><b>${r.score}</b> / 10</td><td>${r.time}</td></tr>`;
     });
     html += `</table>`;
 }
 document.getElementById("recordList").innerHTML = html;
}

function clearRecords(){
 if(confirm("ต้องการล้างข้อมูลคะแนนทั้งหมดใช่หรือไม่?")){
     localStorage.removeItem("exam_records");
     showTeacherPanel();
 }
}

function backToHome(){
 document.getElementById("teacherPanel").classList.add("hidden");
 document.getElementById("start").classList.remove("hidden");
}

function esc(s){return s.replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]))}
</script>
</body></html>
